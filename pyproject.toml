[project]
name = "inverse-flavour"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matthew Starbuck", email = "ms2332@sussex.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy<2",
    "torch==2.2.2",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]